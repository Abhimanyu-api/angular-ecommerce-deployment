<div class="detail-section">
    <div class="container-fluid">

        @if (product; as product) {
        <img [src]="product.imageUrl" [alt]="product.name" class="detail-img">

        <h3>{{ product.name }}</h3>
        <div class="price">{{ product.unitPrice | currency:'USD' }}</div>
        <button (click)="addToCart()" class="btn btn-primary btn-sm">Add to cart</button>

        <hr>
        <h4>Description</h4>
        <p>{{ product.description }}</p>

        <a routerLink="/products" class="mt-5 btn btn-secondary">Back to Products</a>
        } @else {
        <p>Loading product details...</p>
        }
        
    </div>
</div>
